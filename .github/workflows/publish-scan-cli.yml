name: Publish scan CLI

on:
  workflow_dispatch:
  push:
    tags:
      - scan-cli-v*

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  PROJECT: code/TheDiscDb.DiscScan.Cli/TheDiscDb.DiscScan.Cli.csproj

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ startsWith(matrix.rid, 'win-') && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -like "scan-cli-v*") {
            $version = $refName.Substring("scan-cli-v".Length)
          } else {
            $version = "0.0.0-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -p:NuGetAudit=false -o artifacts/publish/${{ matrix.rid }}

      - name: Stage artifact
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $stage = "artifacts/stage/thediscdb-scan-$rid"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "artifacts/publish/$rid/thediscdb-scan*" $stage
          Copy-Item "code/TheDiscDb.DiscScan.Cli/README.md" $stage
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $stage }
          if ($rid.StartsWith("win-")) {
            Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/thediscdb-scan-$rid.zip"
          } else {
            tar -czf "artifacts/thediscdb-scan-$rid.tar.gz" -C "artifacts/stage" "thediscdb-scan-$rid"
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File -Include *.zip,*.tar.gz |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content artifacts/sha256-${{ matrix.rid }}.txt -NoNewline:$false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thediscdb-scan-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/sha256-${{ matrix.rid }}.txt

  release:
    if: startsWith(github.ref, 'refs/tags/scan-cli-v')
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Build combined checksums
        run: |
          cat release-artifacts/sha256-*.txt | sort > release-artifacts/sha256.txt
          rm release-artifacts/sha256-*.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
